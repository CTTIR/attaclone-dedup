name: Plugin safety checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate JavaScript and behavior
        run: |
          node --check bootstrap.js
          node --check content/attaclone-dedup.js
          node --check content/manualResolve.js
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify package
        run: |
          python3 tools/build_xpi.py
          python3 tools/check_xpi.py dist/attaclone-dedup-1.0.1.xpi
          python3 tools/build_xpi.py --output /tmp/attaclone-repeat.xpi
          cmp dist/attaclone-dedup-1.0.1.xpi /tmp/attaclone-repeat.xpi
