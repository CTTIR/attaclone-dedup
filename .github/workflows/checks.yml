name: Plugin safety checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate JavaScript and behavior
        run: |
          node --check bootstrap.js
          node --check content/attaclone-dedup.js
          node --check content/manualResolve.js
          node --test tests/*.test.js tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify package
        run: |
          python3 tools/build_xpi.py
          python3 tools/check_xpi.py dist/attaclone-dedup-1.0.1.xpi
          python3 tools/build_xpi.py --output /tmp/attaclone-repeat.xpi
          cmp dist/attaclone-dedup-1.0.1.xpi /tmp/attaclone-repeat.xpi
